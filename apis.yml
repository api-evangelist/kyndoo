aid: kyndoo
name: Kyndoo
description: >-
  Kyndoo Inc. was a San Francisco based influencer-marketing software platform
  that let brands find, connect to and work with social-media influencers. Its
  differentiator was audience authenticity: Kyndoo built a database of vetted
  influencers and published the "Kyndex" score, described as a credit score for
  influencers, which measured whether a following was made of real people with
  buying intent rather than purchased bot accounts. Around that database it sold
  campaign management, attribution and brand-safety tooling to brands, taking a
  service fee on the influencer deals brands negotiated through the platform.
  The company was surfaced as a 500 Global portfolio company. Kyndoo was
  acquired by CIPIO (cipio.ai) and its web property is now offline - kyndoo.com
  has not served a page since early 2022. Kyndoo never published a public API,
  developer portal or SDK, so this profile is an identity and lifecycle record
  rather than an API profile.
